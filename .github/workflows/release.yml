name: Build and publish Linux release

# Linux-only fork of the upstream release workflow: this fork exists to feed
# the prismlauncher-offline AUR packages, which only need Linux assets.
# The build is produced with the same composite actions as upstream CI.

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to stamp into the build (MAJOR.MINOR.PATCH[.BUILD])
        type: string
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_linux:
    name: Release (Linux x86_64)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      # Empty artifact name keeps prismupdater out of the build: updates of this
      # fork are meant to be delivered by the AUR packages, not by the launcher.
      ARTIFACT_NAME: ""
      BUILD_PLATFORM: offline
      CMAKE_PRESET: linux
      PRISMLAUNCHER_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Linux
          qt-version: 6.10.2

      - name: Configure project
        run: cmake --preset "$CMAKE_PRESET"

      - name: Run build
        run: cmake --build --preset "$CMAKE_PRESET" --config Release

      - name: Run tests
        run: ctest --preset "$CMAKE_PRESET" --build-config Release

      - name: Package (Linux)
        uses: ./.github/actions/package/linux
        with:
          version: ${{ env.VERSION }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: Linux
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

      - name: Normalize asset names
        run: |
          mv PrismLauncher-portable.tar.gz "PrismLauncher-Linux-Qt6-Portable-${VERSION}.tar.gz"
          # On tag pushes the AppImage already carries its final name; on manual
          # dispatches the version and build type are part of the name.
          for suffix in AppImage AppImage.zsync; do
            current="$(ls PrismLauncher-Linux-*"${suffix}" | grep -v "^PrismLauncher-Linux-x86_64\\.${suffix}$" | head -n1 || true)"
            if [[ -n "$current" ]]; then
              mv "$current" "PrismLauncher-Linux-x86_64.${suffix}"
            fi
          done
          ls -la PrismLauncher-Linux-x86_64.AppImage PrismLauncher-Linux-x86_64.AppImage.zsync "PrismLauncher-Linux-Qt6-Portable-${VERSION}.tar.gz"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Prism Launcher Offline ${{ env.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            PrismLauncher-Linux-x86_64.AppImage
            PrismLauncher-Linux-x86_64.AppImage.zsync
            PrismLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
